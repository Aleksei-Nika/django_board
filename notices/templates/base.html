{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Доска объявлений{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'notices/css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <a href="{% url 'notice_list' %}" class="logo">📌 Доска объявлений</a>
            <div class="auth-links">
                {% if user.is_authenticated %}
                    <a href="{% url 'profile_view' %}" style="color: white; font-weight: bold; text-decoration: none;">
                        {{ user.username }}
                    </a>
                    <form action="{% url 'logout' %}" method="post" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn-link">Выйти</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Войти</a> | 
                    <a href="{% url 'register' %}">Зарегистрироваться</a>
                {% endif %}
            </div>
        </div>
    </header>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
