{% extends 'base.html' %}

{% block title %}Удалить: {{ notice.title }}{% endblock %}

{% block content %}
    <h1>Вы уверены, что хотите удалить объявление?</h1>
    <div style="background: #fff3f3; padding: 20px; border: 1px solid #ffcccc; border-radius: 5px; margin-bottom: 20px;">
        <h2>{{ notice.title }}</h2>
        <p>{{ notice.content }}</p>
    </div>
    
    <!-- Удаление всегда должно быть через POST! -->
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn" style="background-color: #e74c3c;">Да, удалить</button>
        <a href="{% url 'notice_detail' notice.pk %}" style="margin-left: 15px; text-decoration: none;">Отмена</a>
    </form>
{% endblock %}
