{% extends 'base.html' %}

{% block title %}Редактировать: {{ notice.title }}{% endblock %}

{% block content %}
    <h1>Редактирование объявления</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Сохранить изменения</button>
        <a href="{% url 'notice_detail' notice.pk %}" style="margin-left: 15px; text-decoration: none;">Отмена</a>
    </form>
{% endblock %}
